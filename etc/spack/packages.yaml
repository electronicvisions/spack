packages:
  all:
    # AMTHosts
    require: 'target=x86_64_v2'
    providers:
      mpi: [openmpi, mpich]
      blas: [openblas]
      lapack: [openblas]
      pil: [py-pillow]
      java: [openjdk]
      pkgconfig: [pkg-config]
  cuda:
    # debian bullseye backports is at 470, eq. 11.4
    version: [11.8.0]
  dask:
    variants: [~distributed]
  py-torch:
    version: [1.9.1]
    variants: ['+cuda cuda_arch=61,80,86']
  py-jaxlib:
    variants: ['+cuda cuda_arch=61,80,86']
  # BEGIN
  # ECM (2025-05-22): pinning stuff for jaxsnn/jaxlib things (to be removed when we move to jax@0.5)
  # (short-term hack for Elias at ISCAS 2025)
  py-chex:
    version: [0.1.7]
  py-optax:
    version: [0.1.4]
  py-scipy:
    version: [1.12.0]
  # END
  binutils:
    variants: [+ld+gold+plugins]
  cairo:
    variants: [+X]
  cppcheck:
    version: [2.7]  # > 2.7 stalls with boost hana
    variants: [+htmlreport]
  gdb:
    require: "@:13.0~debuginfod"  # 13.1 requires zstd with pkgconfig which can not be found, unpin in the future
  genpybind:
    version: ['ebrains']
  hdf5:
    variants: [~mpi+hl]
  libusb:
    buildable: false
    externals:
    - spec: libusb@1.0.22
      prefix: /usr
  llvm:
    version: [15]
    variants: [~shared_libs+visionary+python libcxx=none build_type=Release]
  log4cxx:
    variants: [+events_at_exit]
  mesa:
    # mesa via ghostscript -> libepoxy+glx, but doesn't build with llvm@11.1.0
    variants: [~llvm]
  node-js:
    version: [:21]  # JJK: @22.4.0 did not build (v0.23.1) -> constrain to @:21
  py-netcdf4:
    # we do not build openmpi with slurm support
    variants: [~mpi]
  openblas:
    variants: [cpu_target=NEHALEM]
  nccl:
    variants: ['+cuda cuda_arch=61,80,86']
  nest:
    variants: [~mpi+python]
  pango:
    variants: [+X]
  pcre:
    variants: [+jit]
  python:
    version: ["3.11"]
  py-h5py:
    variants: [~mpi]
  py-tables:
    variants: [~auto~avx2+sse2]
  ruby:
    variants: [~openssl]
  tk:
    variants: [+X]
  vim:
    variants: [+x]
